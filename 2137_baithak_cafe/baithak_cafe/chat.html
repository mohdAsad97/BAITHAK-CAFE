<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat Board</title>
  <style>
    body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    #messages { list-style-type: none; margin: 0; padding: 0; }
    #messages > li { padding: 0.75rem 1.25rem; border-bottom: 1px solid #eee;}
    #messages > li:nth-child(odd) { background: #f9f9f9; }
    
    #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
    #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; outline: none; font-size: 1rem;}
    #input:focus { outline: none; border: 2px solid #007bff;}
    
    #form > button { background: #007bff; border: none; padding: 0 1.5rem; margin: 0.25rem; border-radius: 2rem; outline: none; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s;}
    #form > button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <ul id="messages"></ul>
  
  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button>Send</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    // Send a message when the form is submitted
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value) {
        socket.emit('chat message', input.value);
        input.value = '';
      }
    });

    // Listen for incoming messages from the server
    socket.on('chat message', (msg) => {
      const item = document.createElement('li');
      item.textContent = msg;
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
